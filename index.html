<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IGRIS Red Commander</title>
    <meta name="theme-color" content="#070002">
    <meta name="mobile-web-app-capable" content="yes">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Courier New', monospace; }
        body {
            background-color: #070002;
            color: #ff1a40;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Blood Red Neon Header */
        header { text-align: center; margin-top: 10px; }
        h1 {
            font-size: 2.4rem;
            letter-spacing: 6px;
            color: #ff0033;
            text-shadow: 0 0 15px #ff0033, 0 0 30px #99001f;
        }
        .status-badge {
            display: inline-block;
            margin-top: 6px;
            padding: 4px 14px;
            border: 1px solid #ff0033;
            border-radius: 20px;
            font-size: 0.75rem;
            letter-spacing: 2px;
            background: rgba(255, 0, 51, 0.12);
        }

        /* Center Cyber Wave Visualizer */
        .visualizer-container {
            width: 100%;
            max-width: 400px;
            height: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        canvas {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 12px #ff0033);
        }

        /* Terminal Console */
        .terminal {
            width: 100%;
            max-width: 450px;
            background: rgba(20, 0, 5, 0.9);
            border: 1px solid #ff003377;
            border-radius: 10px;
            padding: 15px;
            height: 180px;
            overflow-y: auto;
            font-size: 0.9rem;
            line-height: 1.4;
            color: #ffccd4;
            box-shadow: inset 0 0 15px rgba(255, 0, 51, 0.2);
        }

        /* Controls */
        .controls {
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 10px;
        }
        .mic-btn {
            background: #ff0033;
            color: #fff;
            border: none;
            padding: 16px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            letter-spacing: 2px;
            box-shadow: 0 0 20px rgba(255, 0, 51, 0.6);
            transition: 0.2s;
        }
        .mic-btn:active { transform: scale(0.97); }
        .server-bar {
            display: flex;
            gap: 8px;
        }
        input {
            flex: 1;
            padding: 12px;
            background: #150005;
            border: 1px solid #ff003355;
            border-radius: 6px;
            color: #fff;
            font-size: 0.85rem;
            outline: none;
        }
        .link-btn {
            padding: 10px 18px;
            background: #30000a;
            color: #ff1a40;
            border: 1px solid #ff1a40;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <h1>⚡ IGRIS</h1>
        <div class="status-badge" id="connStatus">ONLINE // BLOOD PROTOCOL</div>
    </header>

    <div class="visualizer-container">
        <canvas id="waveCanvas"></canvas>
    </div>

    <div class="terminal" id="terminal">
        [IGRIS CORE]: Initialized.<br>
        Awaiting authorized voice instructions.
    </div>

    <div class="controls">
        <button class="mic-btn" id="micBtn" onclick="handleVoice()">🎙️ ACTIVATE IGRIS</button>
        <div class="server-bar">
            <input type="text" id="serverUrl" placeholder="Laptop Server URL (e.g. http://192.168.1.8:8000)">
            <button class="link-btn" onclick="saveServer()">LINK</button>
        </div>
    </div>

    <script>
        // Sci-Fi Sound Synthesizer
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSciFiSound(freq1, freq2, duration) {
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(freq1, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(freq2, audioCtx.currentTime + duration);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

        // Server Storage
        let SERVER_URL = localStorage.getItem("IGRIS_SERVER") || "";
        document.getElementById("serverUrl").value = SERVER_URL;

        function saveServer() {
            SERVER_URL = document.getElementById("serverUrl").value.trim();
            localStorage.setItem("IGRIS_SERVER", SERVER_URL);
            logTerminal("<span style='color:#00ffaa;'>[System]: Server address linked: " + SERVER_URL + "</span>");
            playSciFiSound(300, 800, 0.2);
        }

        function logTerminal(msg) {
            const term = document.getElementById("terminal");
            term.innerHTML += `<br>${msg}`;
            term.scrollTop = term.scrollHeight;
        }

        // Animated Red Wave
        const canvas = document.getElementById('waveCanvas');
        const ctx = canvas.getContext('2d');
        let step = 0;
        let isSpeakingOrListening = false;

        function resizeCanvas() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function drawWave() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.beginPath();
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#ff0033';
            
            const amp = isSpeakingOrListening ? 45 : 12;
            const freq = isSpeakingOrListening ? 0.05 : 0.02;

            for (let x = 0; x < canvas.width; x++) {
                const y = canvas.height / 2 + Math.sin(x * freq + step) * amp * Math.sin(x * 0.008);
                if (x === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();
            step += 0.08;
            requestAnimationFrame(drawWave);
        }
        drawWave();

        // Speech Recognition
        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognizer = SpeechRec ? new SpeechRec() : null;

        function handleVoice() {
            playSciFiSound(200, 600, 0.15);
            if (!recognizer) {
                alert("Speech recognition not supported in this browser. Please use Chrome.");
                return;
            }
            isSpeakingOrListening = true;
            document.getElementById("micBtn").innerText = "🛑 LISTENING...";
            recognizer.start();
        }

        if (recognizer) {
            recognizer.onresult = async (event) => {
                const userCmd = event.results[0][0].transcript;
                document.getElementById("micBtn").innerText = "🎙️ ACTIVATE IGRIS";
                logTerminal(`<span style="color:#fff;">[Commander]:</span> ${userCmd}`);
                sendCommandToServer(userCmd);
            };
            recognizer.onerror = () => {
                isSpeakingOrListening = false;
                document.getElementById("micBtn").innerText = "🎙️ ACTIVATE IGRIS";
            };
        }

        // Send to Laptop Server
        async function sendCommandToServer(cmd) {
            if (!SERVER_URL) {
                logTerminal("<span style='color:#ff4444;'>[Alert]: Please enter your Laptop Server URL below.</span>");
                isSpeakingOrListening = false;
                return;
            }

            logTerminal("[IGRIS]: Analyzing request...");
            try {
                const res = await fetch(`${SERVER_URL}/api/igris`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ command: cmd })
                });
                const data = await res.json();
                const reply = data.response;
                logTerminal(`<span style="color:#ff1a40;">[IGRIS]:</span> ${reply}`);
                speak(reply);
            } catch (err) {
                logTerminal("<span style='color:#ff4444;'>[Link Error]: Could not reach IGRIS server. Make sure server is running on laptop.</span>");
            } finally {
                isSpeakingOrListening = false;
            }
        }

        // Voice Output (Deep Igris Voice)
        function speak(text) {
            if ('speechSynthesis' in window) {
                isSpeakingOrListening = true;
                const ut = new SpeechSynthesisUtterance(text);
                ut.pitch = 0.85;
                ut.rate = 1.0;
                ut.onend = () => { isSpeakingOrListening = false; };
                window.speechSynthesis.speak(ut);
            }
        }
    </script>
</body>
</html>
